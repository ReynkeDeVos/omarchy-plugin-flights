[package]
name = "flight-status"
version = "1.3.0"
edition = "2024"
rust-version = "1.89"
description = "Backend of the Omarchy flights plugin: one dated multi-leg trip as JSON."
license = "MIT"
publish = false

# The binary is committed (Omarchy installs plugins with git and builds nothing),
# so it is kept small: 2.2 MB instead of 3.3 MB. The work is waiting on the network.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

[dependencies]
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
